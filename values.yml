global:
  config:
    dbName: app #test
crunchy: # enable it for TEST and PROD, for PR based pipelines simply use single postgres
  enabled: true
  postgresVersion: 18
  postGISVersion: "3.6"
  imagePullPolicy: IfNotPresent
  image: "artifacts.developer.gov.bc.ca/bcgov-docker-local/crunchy-postgres-gis:ubi9-18.1-3.6-2547"
  # enable below to start a new crunchy cluster after disaster from a backed-up location, crunchy will choose the best place to recover from.
  # follow https://access.crunchydata.com/documentation/postgres-operator/5.8/tutorials/backups-disaster-recovery/disaster-recovery
  # Clone From Backups Stored in S3 / GCS / Azure Blob Storage
  clone:
    enabled: false
    s3:
      enabled: false
    pvc:
      enabled: false
    path: ~ # provide the proper path to source the cluster. ex: /backups/cluster/version/1, if current new cluster being created, this should be current cluster version -1, ideally
  # enable this to go back to a specific timestamp in history in the current cluster.
  # follow https://access.crunchydata.com/documentation/postgres-operator/5.8/tutorials/backups-disaster-recovery/disaster-recovery
  # Perform an In-Place Point-in-time-Recovery (PITR)
  restore:
    repoName: ~ # provide repo name
    enabled: false
    target: ~ # 2024-03-24 17:16:00-07 this is the target timestamp to go back to in current cluster
  instances:
    name: db # high availability
    replicas: 2 # 2 or 3 for high availability in TEST and PROD.
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9187'
    dataVolumeClaimSpec:
      storage: 210Mi
      storageClassName: netapp-block-standard
      walStorage: 255Mi

    requests:
      cpu: 50m
      memory: 128Mi
    replicaCertCopy:
      requests:
        cpu: 1m
        memory: 32Mi

  pgBackRest:
    enabled: true
    backupPath: /backups/test/cluster/version # change it for PROD, create values-prod.yaml
    clusterCounter: 2 # this is the number to identify what is the current counter for the cluster, each time it is cloned it should be incremented.
    # If retention-full-type set to 'count' then the oldest backups will expire when the number of backups reach the number defined in retention
    # If retention-full-type set to 'time' then the number defined in retention will take that many days worth of full backups before expiration
    retentionFullType: count
    s3:
      enabled: false # if enabled, below must be provided
      retention: 7 # one weeks backup in object store.
      bucket: ~
      endpoint: ~
      accessKey: ~
      secretKey: ~
      fullBackupSchedule: 0 9 * * *
      incrementalBackupSchedule: 0 0/5 * * * # every 5 hour incremental
    pvc:
      retention: 1 # one day hot active backup in pvc
      retentionFullType: count
      fullBackupSchedule: 0 8 * * *
      incrementalBackupSchedule: 0 0,12 * * * # every 12 hour incremental
      volume:
        accessModes: "ReadWriteOnce"
        storage: 100Mi
        storageClassName: netapp-file-backup

    config:
      requests:
        cpu: 5m
        memory: 32Mi
    repoHost:
      requests:
        cpu: 20m
        memory: 128Mi
    sidecars:
      requests:
        cpu: 5m
        memory: 16Mi
    jobs:
      requests:
        cpu: 20m
        memory: 128Mi

  patroni:
    postgresql:
      pg_hba:
        - "host all all 0.0.0.0/0 md5"
        - "host all all ::1/128 md5"
      parameters:
        shared_buffers: 16MB # default is 128MB; a good tuned default for shared_buffers is 25% of the memory allocated to the pod
        wal_buffers: "64kB" # this can be set to -1 to automatically set as 1/32 of shared_buffers or 64kB, whichever is larger
        min_wal_size: 32MB
        max_wal_size: 64MB # default is 1GB
        max_slot_wal_keep_size: 128MB # default is -1, allowing unlimited wal growth when replicas fall behind
        work_mem: 2MB # a work_mem value of 2 MB
        log_min_duration_statement: 1000ms # log queries taking more than 1 second to respond.
        effective_io_concurrency: 20 #If the underlying disk can handle multiple simultaneous requests, then you should increase the effective_io_concurrency value and test what value provides the best application performance. All BCGov clusters have SSD.

  proxy:
    enabled: true
    pgBouncer:
      image: # it's not necessary to specify an image as the images specified in the Crunchy Postgres Operator will be pulled by default
      replicas: 1
      requests:
        cpu: 5m
        memory: 32Mi
      maxConnections: 10 # make sure less than postgres max connections

  # Postgres Cluster resource values:
  pgmonitor:
    enabled: true
    exporter:
      image: # it's not necessary to specify an image as the images specified in the Crunchy Postgres Operator will be pulled by default
      requests:
        cpu: 10m
        memory: 32Mi
  # Custom users section. This section defines database users and their associated configurations.
  # Each user entry can include the following fields:
  # - name: The username. Can use template interpolation (e.g., {{ .Values.global.config.dbName }}).
  # - databases: A list of databases the user has access to. Can include template-interpolated values.
  # - options: A string specifying user privileges (e.g., "SUPERUSER CREATEDB CREATEROLE"). Ensure the options are valid PostgreSQL roles.
  # For more details, refer to the Crunchy Postgres Operator documentation: 
  # https://access.crunchydata.com/documentation/postgres-operator/latest/tutorials/basic-setup/user-management
  users: 
    - name: '{{ .Values.global.config.dbName }}'
      databases:
        - '{{ .Values.global.config.dbName }}'
      options: "SUPERUSER CREATEDB CREATEROLE"
    - name: 'postgres'
      databases:
        - 'postgres'
        - '{{ .Values.global.config.dbName }}'
    - name: '{{ .Values.global.config.dbName }}proxy'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: '{{ .Values.global.config.dbName }}proxytest'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
        
# This is a separate backup configuration using the BC GOV backup container. Used for both longer retention and disaster recovery.
# https://github.com/bcgov/backup-container
backup-storage:
  enabled: false
  image:
    repository: ghcr.io/bcgov/backup-container
    pullPolicy: IfNotPresent
    tag: 2.13.0

  backupConfig: |
    postgres=pg_service:5432/db_name # change for your instance
    0 1 * * * default ./backup.sh -s

# Currently verification is not working because the backup container doesn't have PGAUDIT or POSTGIS extensions installed, which are required to run the verification. 
# Once the backup container is updated to include these extensions, we can enable the verification schedule below.
#     0 4 * * * default ./backup.sh -s -v all

  db:
    enabled: false
    secretName: ""
    usernameKey: ""
    passwordKey: ""

  env:
    ENVIRONMENT_FRIENDLY_NAME:
      value: "$PROJECT_NAME Database"
    BACKUP_STRATEGY:
      value: "rolling"
    DAILY_BACKUPS:
      value: "7"
    WEEKLY_BACKUPS:
      value: "4"
    MONTHLY_BACKUPS:
      value: "2"
    S3_BUCKET:
      value: "" # DO NOT UPLOAD TO GITHUB.
      secure: true
    S3_USER:
      value: "" # DO NOT UPLOAD TO GITHUB.
      secure: true
    S3_PASSWORD:
      value: "" # DO NOT UPLOAD TO GITHUB.
      secure: true
    S3_ENDPOINT:
      value: "" # DO NOT UPLOAD TO GITHUB.
      secure: true
    S3_PRUNE_BACKUPS:
      value: "true"

  persistence:
    backup:
      size: 1Gi
      storageClassName: netapp-block-standard
    verification:
      size: 100Mi
      storageClassName: netapp-block-standard

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
